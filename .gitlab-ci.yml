# AdGuardHome Docker Image CI/CD
# - Auto-build triggers on push to tracked branches
# - Promote to live is manual (run via GitLab UI → Run pipeline)

stages:
  - build
  - promote

variables:
  IMAGE_NAME: andrianey/adguardhomedotdoh

# ─── JOB 1: Continuous Build (Auto-Tag) ───────────────────────────────────────

build-auto-tag:
  stage: build
  tags:
    - oracle
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl jq
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
    - docker buildx create --use --name multiarch-builder
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
  script:
    - |
      if echo "$CI_COMMIT_BRANCH" | grep -q "wolfi"; then
        PLATFORMS="linux/amd64,linux/arm64"
      else
        PLATFORMS="linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6"
      fi
      docker buildx build \
        --platform "$PLATFORMS" \
        --push \
        --no-cache \
        -t "$IMAGE_NAME:${CI_COMMIT_BRANCH}-auto" \
        .
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(latest|hardened|latest-wolfi|hardened-wolfi)$/ && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "{*,**/*}"
        ignore:
          - README.md
          - LICENSE
          - docker-compose.yml
          - SECURITY-MATRIX.md
          - .gemini/**
          - .gitignore
    - when: never

# ─── JOB 2: Promote to Live (Manual) ─────────────────────────────────────────

promote-to-live:
  stage: promote
  tags:
    - oracle
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    TARGET_BRANCH:
      value: "latest"
      description: "Branch/tag to promote (latest, latest-wolfi, hardened, hardened-wolfi)"
      options:
        - latest
        - latest-wolfi
        - hardened
        - hardened-wolfi
  before_script:
    - apk add --no-cache curl jq
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
    - docker buildx create --use --name multiarch-builder
  script:
    - |
      docker buildx imagetools create \
        -t "$IMAGE_NAME:${TARGET_BRANCH}" \
        "$IMAGE_NAME:${TARGET_BRANCH}-auto"
    - |
      TOKEN=$(curl -s \
        -H "Content-Type: application/json" \
        -X POST \
        -d "{\"username\": \"${DOCKERHUB_USERNAME}\", \"password\": \"${DOCKERHUB_TOKEN}\"}" \
        https://hub.docker.com/v2/users/login/ | jq -r .token)

      curl -i -X DELETE \
        -H "Authorization: JWT ${TOKEN}" \
        "https://hub.docker.com/v2/repositories/andrianey/adguardhomedotdoh/tags/${TARGET_BRANCH}-auto"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never