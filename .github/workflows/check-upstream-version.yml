name: Watch AdGuardHome Upstream
on:
  schedule:
    - cron: '0 * * * *'  # Hourly check
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    environment: docker-build 
    strategy:
      matrix:
        include:
          - type: "stable"
            branches: ["latest", "latest-wolfi"]
          - type: "edge"
            branches: ["hardened", "hardened-wolfi"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Latest Version and Compare
        id: version_check
        run: |
          # 1. Fetch Upstream Data (Mimicking your GitLab 'inspect' logic)
          if [[ "${{ matrix.type }}" == "stable" ]]; then
            UPSTREAM=$(curl -s https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest | jq -r .tag_name)
          else
            # We inspect the official edge image labels. 
            # AdGuard embeds the long version string in 'org.opencontainers.image.version'
            UPSTREAM=$(docker buildx imagetools inspect adguard/adguardhome:edge --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' || echo "edge")
            
            # Fallback: if labels are empty, we use the Tag API as a backup
            if [[ "$UPSTREAM" == "edge" || -z "$UPSTREAM" ]]; then
               UPSTREAM=$(curl -s "https://api.github.com/repos/AdguardTeam/AdGuardHome/tags" | jq -r '.[0].name')
            fi
          fi

          # 2. Extract CLEAN version from README.md
          BRANCH_NAME="${{ matrix.branches[0] }}"
          RAW_ROW=$(grep "| \`$BRANCH_NAME\` |" README.md)
          
          # Extracts the version and stops before the ']' 
          # Matches: v0.108.0-a.1244+82f2ac68
          CURRENT=$(echo "$RAW_ROW" | awk -F'|' '{print $3}' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+[^]]*' | head -1 | cut -d']' -f1 | xargs)

          echo "Upstream (from Image Labels): $UPSTREAM"
          echo "README (Current):             $CURRENT"

          # 3. Decision Logic
          if [[ -n "$UPSTREAM" ]] && [[ "$UPSTREAM" == "$CURRENT" ]]; then
            echo "✅ Exact match. Skipping build for $BRANCH_NAME."
            echo "should_trigger=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 Mismatch detected! Triggering GitLab..."
            echo "should_trigger=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger GitLab
        # Only run if a new version was found
        if: steps.version_check.outputs.should_trigger == 'true'
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
        run: |
          for branch in ${{ join(matrix.branches, ' ') }}; do
            echo "==> Triggering GitLab branch: $branch"
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --request POST \
              --form token="$GITLAB_TRIGGER_TOKEN" \
              --form ref="$branch" \
              --form "variables[UPSTREAM_SYNC]=true" \
              "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/trigger/pipeline")
            
            if [ "$RESPONSE" = "201" ]; then
              echo "✅ Success: Pipeline created for $branch"
            else
              echo "❌ Failed: GitLab returned HTTP $RESPONSE"
              exit 1
            fi
          done
