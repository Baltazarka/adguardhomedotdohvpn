name: Watch AdGuardHome Upstream
on:
  schedule:
    - cron: '0 * * * *'  # Hourly check
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - type: "stable"
            branches: ["latest", "latest-wolfi"]
          - type: "edge"
            branches: ["hardened", "hardened-wolfi"]

    steps:
      - name: Get Latest Version/Hash
        id: version_check
        run: |
          if [[ "${{ matrix.type }}" == "stable" ]]; then
            VAL=$(curl -s https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest | jq -r .tag_name)
          else
            VAL=$(curl -s "https://hub.docker.com/v2/repositories/adguard/adguardhome/tags/edge" | jq -r '.images[0].digest')
          fi
          echo "current_val=$VAL" >> $GITHUB_OUTPUT

      - name: Trigger GitLab
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
        run: |
          for branch in ${{ join(matrix.branches, ' ') }}; do
            echo "==> Triggering GitLab branch: $branch"
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --request POST \
              --form token="$GITLAB_TRIGGER_TOKEN" \
              --form ref="$branch" \
              --form "variables[UPSTREAM_SYNC]=true" \
              "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/trigger/pipeline")
            
            if [ "$RESPONSE" = "201" ]; then
              echo "✅ Success: Pipeline created for $branch (HTTP 201)"
            else
              echo "❌ Failed: GitLab returned HTTP $RESPONSE for $branch"
              exit 1
            fi
          done